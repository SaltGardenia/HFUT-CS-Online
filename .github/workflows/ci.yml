name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读检出：本工作流不需要写仓库，锁死 GITHUB_TOKEN 权限
permissions:
  contents: read

# 同一分支 / PR 连推时取消旧运行，避免旧结果覆盖新状态
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npx tsc -b
      - name: 单元测试
        run: npx vitest run
      # 资料目录（data/ 仅本地、补充资料/ 入库）的生成物必须与内容同步：
      # 贡献者加/删资料后忘跑 npm run catalog:supplement，这一步会指出要更新哪些文件。
      - name: 资料目录生成物是否最新
        run: node scripts/build-catalog.mjs --supplement-only --check
      - name: 构建
        run: npx vite build
