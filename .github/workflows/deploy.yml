name: Deploy (main + branch previews)

# 一次运行产出一个完整站点：根目录永远是 origin/main，分支预览挂在 /preview/<slug>/ 下。
# 主站与预览同属一个 Pages 产物，所以任何触发都不会把对方刷掉；PR 内容只在预览子目录里。
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_BASE: /HFUT-CS-Online/
  PREVIEW_MAX: '8'
  PREVIEW_TTL_DAYS: '14'

jobs:
  build:
    # fork 的 PR 没有 Pages 写权限，也取不到 head 分支，交给 CI 工作流检查即可
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # PR 触发时工作区是 PR 的合并提交；主站一律从 origin/main 构建
      - name: 切到 main
        run: git checkout -f -B main origin/main

      - run: npm ci

      - name: 类型检查与测试
        run: |
          npx tsc -b
          npx vitest run

      - name: 构建主站
        run: npm run build

      - name: 计算预览目标
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/preview-targets.mjs

      - name: 构建分支预览
        if: steps.targets.outputs.count != '0'
        env:
          SITE_BASE: ${{ env.SITE_BASE }}
        run: bash .github/scripts/build-previews.sh "${{ steps.targets.outputs.file }}" dist

      - name: 生成预览索引页
        env:
          PREVIEW_TARGETS_FILE: ${{ steps.targets.outputs.file }}
        run: node .github/scripts/preview-index.mjs "$PREVIEW_TARGETS_FILE" "${RUNNER_TEMP}/preview-built.txt" dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
