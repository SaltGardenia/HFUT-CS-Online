name: Preview PR (publish)

# 由 Preview PR (build) 触发，在默认分支上下文里发布它构建好的产物。
# 这样 fork PR 的代码只在只读的 build 里被执行，发布这一步拿到的是成品目录。
# 版本号用 PR head SHA：deploy-pages 会把 GITHUB_SHA（这里是 main）当版本，同一提交重复发布会
# 命中 Pages 去重导致内容不更新，所以改用 pages-deploy.mjs 显式指定版本。
#
# 手动补发：Actions → Preview PR (publish) → Run workflow，填构建运行 ID
# （同分支上 Preview PR (build) 的 run id）。用于同组排队时被新运行取代、没发出去的那次。

on:
  workflow_run:
    workflows: ['Preview PR (build)']
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Preview PR (build) 的运行 ID
        required: true
      pr:
        description: PR 编号（留空则按 head SHA 反查）
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://saltgardenia.github.io/HFUT-CS-Online/
    env:
      SITE: https://saltgardenia.github.io/HFUT-CS-Online
    steps:
      - uses: actions/checkout@v7

      - name: 解析构建信息
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs['run-id'] }}
          INPUT_PR: ${{ inputs.pr }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          run="${INPUT_RUN:-$EVENT_RUN}"
          if [ -z "$run" ]; then
            echo "缺少构建运行 ID"
            exit 1
          fi
          if [ -n "$INPUT_RUN" ]; then
            # 手动补发：从构建运行里取 head SHA 当版本号
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq .head_sha)
            pr="$INPUT_PR"
          else
            sha="$EVENT_SHA"
            pr="$EVENT_PR"
          fi
          [ -n "$sha" ] || { echo "拿不到构建的 head SHA"; exit 1; }
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
          echo "PAGES_VERSION=$sha" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
          echo "构建运行：$run，版本 $sha，PR ${pr:-（待反查）}"

      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: ${{ runner.temp }}
          run-id: ${{ steps.meta.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 解包产物
        run: |
          mkdir -p dist
          tar -xf "$RUNNER_TEMP/site-dist.tar" -C dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

      - name: 发布（显式版本号，避免 Pages 按 SHA 去重）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pages-deploy.mjs

      # 在 PR 里留一条会随提交更新的预览评论；PR 已关闭时不评论
      - name: 回贴预览链接
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$PR_NUMBER"
          # 个别 PR（例如来自 fork 的运行）事件里没有 pull_requests，用 head SHA 反查
          if [ -z "$pr" ]; then
            pr=$(gh pr list --state open --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"$PAGES_VERSION\") | .number" | head -1)
          fi
          [ -n "$pr" ] || { echo "无法确定 PR 编号，跳过评论"; exit 0; }
          state=$(gh pr view "$pr" --json state -q .state 2>/dev/null || true)
          [ "$state" = "OPEN" ] || { echo "PR #$pr 不是 OPEN（$state），跳过评论"; exit 0; }
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          <!-- hfut-preview -->
          预览已更新：$SITE/preview/pr-$pr/

          - 每次向本 PR 提交都会自动重建
          - 主站仍按 Release 发布，这里只是本 PR 的渲染结果
          - PR 关闭后不再构建；下一次任意构建会把它从预览索引里摘掉
          EOF
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- hfut-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
            echo "已更新 PR #$pr 的预览评论（$id）"
          else
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/comment.md"
            echo "已发布 PR #$pr 的预览评论"
          fi
